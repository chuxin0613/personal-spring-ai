spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  application:
    name: spring-ai
  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          batch_size: 25
          time_zone: Asia/Shanghai
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
  ai:
    openai:
      base-url: https://api.chatanywhere.tech
      api-key: sk-XyuOSjUWXxwYlVxIeKildKzgoR2WkT9meUkICW6vBMmvT692
      model: gpt-3.5-turbo
      chat:
        options:
          model: gpt-3.5-turbo
  datasource:
    url: jdbc:mysql://localhost:3306/spring_ai?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
server:
  servlet:
    encoding:
      charset: utf-8
      force: true
      enabled: true
logging:
  level:
    org.springframework.ai.chat.client.advisor: info